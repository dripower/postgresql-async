# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches: ["0.3.x", "0.4.x", "0.5.x"]
  pull_request:
    branches: ["0.3.x", "0.4.x", "0.5.x"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PGUSER: postgres
      MYSQLV: '5.7'
      PGV: '15'
    strategy:
     matrix:
       scala: ["2.13.18", "3.3.8", "2.12.20"]

    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Start postgresql & mysql
        working-directory: build/server
        run:
          docker compose up -d && docker compose logs

      - name: Setup database
        run: bash build/prepare_build.sh

      - name: Run tests
        # sbt 2.x 的 ++ 命令会执行两遍 test（导致 CI 测试对象互相干扰），改用 set 切换版本
        run: sbt 'set scalaVersion := "${{matrix.scala}}"; test'
