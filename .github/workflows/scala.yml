# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches: ["0.3.x", "0.4.x"]
  pull_request:
    branches: ["0.3.x", "0.4.x"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PGUSER: postgres
      MYSQLV: '5.7'
      PGV: '15'
    strategy:
     matrix:
       scala: [2.13, 3.3, 2.12]

    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Start postgresql & mysql
        working-directory: build/server
        run:
          docker compose up -d && docker compose logs

      - name: Setup database
        run: bash build/prepare_build.sh

      - name: Run common tests
        run: sbt ++${{matrix.scala}} common/test

      - name: Run postgresql tests
        run: sbt ++${{matrix.scala}} postgresql/test

      - name: Run mysql tests
        run: |
          sbt ++${{matrix.scala}} mysql/test &
          sbt_pid=$!

          (
            sleep 240
            if kill -0 "$sbt_pid" 2>/dev/null; then
              echo "::error::mysql/test is still running after 240 seconds; printing JVM thread dumps"
              jcmd || true
              for pid in $(jcmd | awk '{print $1}'); do
                echo "===== Thread dump for JVM $pid ====="
                jcmd "$pid" Thread.print || true
              done
              echo "===== Process list ====="
              ps -ef
              kill "$sbt_pid" 2>/dev/null || true
            fi
          ) &
          watchdog_pid=$!

          wait "$sbt_pid"
          status=$?
          kill "$watchdog_pid" 2>/dev/null || true
          exit "$status"
